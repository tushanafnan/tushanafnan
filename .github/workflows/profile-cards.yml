name: Refresh profile cards

on:
  schedule:
    - cron: '17 3 * * *' # Daily, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-cards
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate self-hosted cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: tushanafnan
          cards: overview,contributions,languages
          output-dir: profile
          themes: light,dark
          palette: blue
          language-limit: 7
          commit: true
